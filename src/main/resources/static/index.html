<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duo Builders</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --text: #1f2440;
      --muted: #6d7188;
      --purple: #65609f;
      --purple-dark: #3f3a72;
      --cyan: #66d4dd;
      --line: #d9dcef;
      --field: #e4e2dd;
      --danger: #a33c3c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .login-view {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(584px, 100%);
      min-height: 680px;
      padding: 70px 42px 42px;
      background: var(--panel);
      border: 2px solid var(--line);
      display: grid;
      align-content: start;
      gap: 16px;
    }

    .login-logo {
      width: 235px;
      justify-self: center;
      margin-bottom: 8px;
    }

    .login-title {
      margin: 0;
      text-align: center;
      font-size: 31px;
      font-weight: 650;
      line-height: 1.2;
    }

    .login-subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      text-align: center;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--text);
      font-weight: 500;
    }

    input,
    select {
      width: 100%;
      min-height: 38px;
      border: 2px solid #b9b8b0;
      background: var(--field);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 0;
    }

    input:focus,
    select:focus {
      outline: 2px solid #5f8db8;
      outline-offset: 0;
      background: #ffffff;
    }

    .login-button,
    .run-button {
      min-height: 48px;
      border: 2px solid #b9b8b0;
      background: var(--purple);
      color: #ffffff;
      font-weight: 650;
      cursor: pointer;
    }

    .login-error {
      min-height: 22px;
      margin: 0;
      color: var(--danger);
      font-size: 14px;
    }

    .app-view {
      min-height: 100vh;
      padding: 20px 10px 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
    }

    .app-header {
      display: grid;
      grid-template-columns: 160px 1fr auto;
      align-items: center;
      gap: 20px;
    }

    .app-logo {
      width: 160px;
      background: #ffffff;
    }

    .brand h1 {
      margin: 0;
      font-size: 35px;
      line-height: 1.15;
      font-weight: 700;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .logout-button,
    .plain-button {
      min-height: 40px;
      min-width: 132px;
      border: 2px solid #b9b8b0;
      background: var(--field);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
    }

    .layout {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      gap: 20px;
      min-height: 0;
    }

    .sidebar {
      background: var(--purple-dark);
      color: #ffffff;
      padding: 24px 20px;
      min-height: 720px;
    }

    .sidebar h2 {
      margin: 0 0 20px;
      font-size: 24px;
      line-height: 1.2;
    }

    .sidebar p {
      margin: 0 0 26px;
      color: #d7d5f0;
    }

    .modules {
      display: grid;
      gap: 2px;
    }

    .module-button {
      min-height: 24px;
      border: 0;
      background: transparent;
      color: #ffffff;
      text-align: left;
      padding: 2px 0;
      cursor: pointer;
      font-size: 16px;
    }

    .module-button.active {
      background: var(--cyan);
      color: var(--text);
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(340px, 1fr);
      gap: 18px;
      min-width: 0;
    }

    .query-panel,
    .results-panel {
      background: var(--panel);
      border: 2px solid var(--line);
      padding: 20px;
    }

    .query-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
    }

    .query-line h2,
    .results-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .description {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
    }

    .fields {
      min-height: 82px;
      border: 2px solid var(--line);
      padding: 4px 0 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
    }

    .fields label {
      padding: 0;
      font-size: 16px;
    }

    .actions {
      margin-top: 18px;
      border: 2px solid var(--line);
      padding: 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .actions button {
      width: 134px;
    }

    .results-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .results-head {
      border: 2px solid var(--line);
      border-bottom: 0;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding-left: 0;
    }

    .results-head h2 {
      padding-left: 0;
    }

    .results {
      min-height: 308px;
      margin: 0;
      padding: 18px 16px;
      border: 2px solid var(--line);
      background: #fbfcff;
      color: var(--text);
      overflow: auto;
      white-space: pre-wrap;
      font: 15px/1.45 Consolas, "Courier New", monospace;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .login-card {
        min-height: auto;
        padding: 36px 24px;
      }

      .app-header {
        grid-template-columns: 112px 1fr;
      }

      .logout-button {
        grid-column: 1 / -1;
        width: 100%;
      }

      .app-logo {
        width: 112px;
      }

      .brand h1 {
        font-size: 28px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: 0;
      }

      .fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section class="login-view" id="loginView">
    <form class="login-card" id="loginForm">
      <img class="login-logo" src="/duo_builders_logo.png" alt="Duo Builders">
      <h1 class="login-title">Construction Management System</h1>
      <p class="login-subtitle">Sign in to manage projects, payroll, materials, and services.</p>

      <label>
        User
        <input id="username" autocomplete="username" autofocus>
      </label>

      <label>
        Password
        <input id="password" type="password" autocomplete="current-password">
      </label>

      <button class="login-button" type="submit">Login</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </section>

  <section class="app-view hidden" id="appView">
    <header class="app-header">
      <img class="app-logo" src="/duo_builders_logo.png" alt="Duo Builders">
      <div class="brand">
        <h1>Duo Builders</h1>
        <p>Construction Management System</p>
      </div>
      <button class="logout-button" id="logoutButton">Logout</button>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>Modules</h2>
        <p>Choose a workspace area</p>
        <div class="modules" id="modules"></div>
      </aside>

      <div class="workspace">
        <section class="query-panel">
          <div class="query-line">
            <h2>Query</h2>
            <select id="querySelect"></select>
          </div>
          <p class="description" id="description"></p>
          <div class="fields" id="fields"></div>
          <div class="actions">
            <button class="run-button" id="runButton">Run Query</button>
            <button class="plain-button" id="clearFieldsButton">Clear Fields</button>
          </div>
        </section>

        <section class="results-panel">
          <div class="results-head">
            <h2>Results</h2>
            <button class="plain-button" id="copyButton">Copy</button>
            <button class="plain-button" id="clearResultsButton">Clear</button>
          </div>
          <pre class="results" id="results">Login to load the construction system.</pre>
        </section>
      </div>
    </main>

    <footer class="status" id="status">Ready</footer>
  </section>

  <script>
    const sections = {
      "Construction Sites": {
        reference: "ListConstructionSiteReferences",
        queries: [
          {
            title: "Register Construction Site",
            description: "Create a new construction site record.",
            functionName: "RegisterConstructionSite",
            fields: [
              { key: "construction_site_id", label: "Construction site ID" },
              { key: "customer_id", label: "Customer ID", optional: true },
              { key: "country", label: "Country", optional: true },
              { key: "city", label: "City", optional: true },
              { key: "street", label: "Street", optional: true },
              { key: "address", label: "Address", optional: true }
            ]
          },
          {
            title: "Update Construction Site",
            description: "Change customer or address data for an existing construction site.",
            functionName: "UpdateConstructionSite",
            fields: [
              { key: "construction_site_id", label: "Construction site ID" },
              { key: "customer_id", label: "Customer ID", optional: true },
              { key: "country", label: "Country", optional: true },
              { key: "city", label: "City", optional: true },
              { key: "street", label: "Street", optional: true },
              { key: "address", label: "Address", optional: true }
            ]
          },
          {
            title: "Delete Construction Site",
            description: "Delete a construction site by ID when it has no dependent records.",
            functionName: "DeleteConstructionSite",
            fields: [{ key: "construction_site_id", label: "Construction site ID" }]
          },
          {
            title: "Construction Info",
            description: "Find address and customer information by construction site ID.",
            functionName: "ConstructionInfo",
            fields: [{ key: "construction_id", label: "Construction site ID" }]
          },
          {
            title: "Search Construction By Customer",
            description: "Search construction sites by customer name.",
            functionName: "SearchConstructionSiteByName",
            fields: [{ key: "name", label: "Customer name" }]
          },
          {
            title: "Search Construction By ID",
            description: "Find a construction site by ID.",
            functionName: "SearchConstructionSiteByID",
            fields: [{ key: "construction_site_id", label: "Construction site ID" }]
          },
          {
            title: "Employees In Construction",
            description: "List employees assigned to a construction site.",
            functionName: "AllOfTheEmployeesInTheConstruction",
            fields: [{ key: "construction_site_id", label: "Construction site ID" }]
          }
        ]
      },
      "Customers": {
        reference: "ListCustomerReferences",
        queries: [
          {
            title: "Customer Info",
            description: "Find phone, email, and customer type by customer ID.",
            functionName: "CustomerInfo",
            fields: [{ key: "customer_id", label: "Customer ID" }]
          }
        ]
      },
      "Employees": {
        reference: "ListEmployeeReferences",
        queries: [
          {
            title: "Register Employee",
            description: "Create a new employee record and optionally assign boss, construction site, payroll and bank data.",
            functionName: "RegisterEmployee",
            fields: [
              { key: "employee_id", label: "Employee ID" },
              { key: "boss_id", label: "Boss ID", optional: true },
              { key: "construction_site_id", label: "Construction site ID", optional: true },
              { key: "first_name", label: "First name" },
              { key: "last_name", label: "Last name" },
              { key: "start_date", label: "Start date", kind: "date", optional: true },
              { key: "hire_date", label: "Hire date", kind: "date", optional: true },
              { key: "current_pay", label: "Current pay", kind: "number", optional: true },
              { key: "bank_account", label: "Bank account", optional: true },
              { key: "bank_name", label: "Bank name", optional: true },
              { key: "phone", label: "Phone", optional: true }
            ]
          },
          {
            title: "Update Employee",
            description: "Change employee assignment, payroll, bank or contact data.",
            functionName: "UpdateEmployee",
            fields: [
              { key: "employee_id", label: "Employee ID" },
              { key: "boss_id", label: "Boss ID", optional: true },
              { key: "construction_site_id", label: "Construction site ID", optional: true },
              { key: "first_name", label: "First name", optional: true },
              { key: "last_name", label: "Last name", optional: true },
              { key: "start_date", label: "Start date", kind: "date", optional: true },
              { key: "hire_date", label: "Hire date", kind: "date", optional: true },
              { key: "current_pay", label: "Current pay", kind: "number", optional: true },
              { key: "bank_account", label: "Bank account", optional: true },
              { key: "bank_name", label: "Bank name", optional: true },
              { key: "phone", label: "Phone", optional: true }
            ]
          },
          {
            title: "Delete Employee",
            description: "Delete an employee by ID when it has no dependent records.",
            functionName: "DeleteEmployee",
            fields: [{ key: "employee_id", label: "Employee ID" }]
          },
          {
            title: "Employees Under Managers",
            description: "List employees together with their manager.",
            functionName: "ConsultEmployeesUnderManagers",
            fields: []
          },
          {
            title: "Employee Info",
            description: "Find contact and employment dates by employee ID.",
            functionName: "EmployeeInfo",
            fields: [{ key: "employee_id", label: "Employee ID" }]
          },
          {
            title: "Employees By Bank",
            description: "List employees that use a specific bank.",
            functionName: "EmployeesInBank",
            fields: [{ key: "bank_name", label: "Bank name" }]
          },
          {
            title: "Employees By License",
            description: "List employees that share a license type.",
            functionName: "EmployeesWithSameLicense",
            fields: [{ key: "license_type", label: "License type" }]
          }
        ]
      },
      "Payments": {
        reference: "ListPaymentReferences",
        queries: [
          {
            title: "Paid Amount",
            description: "Consult payment amount for a year, week, and employee.",
            functionName: "ConsultPaidPeriod",
            fields: [
              { key: "year", label: "Year", kind: "int" },
              { key: "week_number", label: "Week number", kind: "int" },
              { key: "employee_id", label: "Employee ID" }
            ]
          },
          {
            title: "Deductible Tax",
            description: "Consult tax for a year, week, and employee.",
            functionName: "ConsultDeductibleTax",
            fields: [
              { key: "year", label: "Year", kind: "int" },
              { key: "week_number", label: "Week number", kind: "int" },
              { key: "employee_id", label: "Employee ID" }
            ]
          },
          {
            title: "Week Was Paid",
            description: "Check whether an employee has a pay date for a week.",
            functionName: "PayWeek",
            fields: [
              { key: "year", label: "Year", kind: "int" },
              { key: "week_number", label: "Week number", kind: "int" },
              { key: "employee_id", label: "Employee ID" }
            ]
          }
        ]
      },
      "Payroll Payment": {
        reference: "ListPayrollPaymentReferences",
        queries: [
          {
            title: "Employees To Pay",
            description: "List every employee with current pay, calculated payment, tax, and pay status for a week.",
            functionName: "ListEmployeesToPay",
            fields: [
              { key: "year", label: "Year", kind: "int" },
              { key: "week_number", label: "Week number", kind: "int" }
            ]
          },
          {
            title: "Register Employee Payment",
            description: "Pay one employee for a week using CurrentPay and the employee's last tax value.",
            functionName: "PayEmployee",
            fields: [
              { key: "year", label: "Year", kind: "int" },
              { key: "week_number", label: "Week number", kind: "int" },
              { key: "employee_id", label: "Employee ID" }
            ]
          }
        ]
      },
      "Machines": {
        reference: "ListMachineReferences",
        queries: [
          {
            title: "All Machines",
            description: "List every machine and whether it is in use.",
            functionName: "ListAllMachines",
            fields: []
          },
          {
            title: "Machines In Construction",
            description: "List machines assigned to a construction site.",
            functionName: "ListAllMachinesInConstruction",
            fields: [{ key: "construction_site_id", label: "Construction site ID" }]
          }
        ]
      },
      "Materials & Warehouses": {
        reference: "ListMaterialWarehouseReferences",
        queries: [
          {
            title: "Material Purpose",
            description: "Find the purpose of a material by name.",
            functionName: "MaterialPurpose",
            fields: [{ key: "name", label: "Material name" }]
          },
          {
            title: "Current Stock Quantity",
            description: "Find stock quantity for a warehouse and material.",
            functionName: "CurrentStockQuantity",
            fields: [
              { key: "warehouse_id", label: "Warehouse ID" },
              { key: "material_id", label: "Material ID" }
            ]
          },
          {
            title: "All Warehouses",
            description: "List all warehouses.",
            functionName: "ListAllWarehouses",
            fields: []
          },
          {
            title: "Warehouses In Construction",
            description: "List warehouses assigned to a construction site.",
            functionName: "WhichWareHousesAreInTheConstructionSite",
            fields: [{ key: "construction_site_id", label: "Construction site ID" }]
          }
        ]
      },
      "External Services": {
        reference: "ListExternalServiceReferences",
        queries: [
          {
            title: "External Companies",
            description: "List external service companies.",
            functionName: "ServiceExternalCompanies",
            fields: []
          },
          {
            title: "Companies By Service Type",
            description: "List service companies by service type.",
            functionName: "ListServiceCompanyByTypeService",
            fields: [{ key: "type_service", label: "Service type" }]
          }
        ]
      }
    };

    const loginView = document.querySelector("#loginView");
    const appView = document.querySelector("#appView");
    const loginForm = document.querySelector("#loginForm");
    const loginError = document.querySelector("#loginError");
    const modules = document.querySelector("#modules");
    const querySelect = document.querySelector("#querySelect");
    const description = document.querySelector("#description");
    const fields = document.querySelector("#fields");
    const results = document.querySelector("#results");
    const status = document.querySelector("#status");

    let currentSection = "Construction Sites";
    let referenceCache = {};

    function setStatus(message) {
      status.textContent = message;
    }

    function currentQuery() {
      return sections[currentSection].queries.find((query) => query.title === querySelect.value);
    }

    async function runQuery(functionName, args = {}) {
      const response = await fetch(`/api/queries/${functionName}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ args })
      });

      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || "Query failed.");
      }
      return payload.result;
    }

    function renderModules() {
      modules.innerHTML = "";
      Object.keys(sections).forEach((sectionName) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "module-button";
        button.textContent = sectionName;
        if (sectionName === currentSection) {
          button.classList.add("active");
        }
        button.addEventListener("click", () => selectSection(sectionName));
        modules.appendChild(button);
      });
    }

    function renderQueries() {
      querySelect.innerHTML = "";
      sections[currentSection].queries.forEach((query) => {
        const option = document.createElement("option");
        option.value = query.title;
        option.textContent = query.title;
        querySelect.appendChild(option);
      });
      renderFields();
    }

    function renderFields() {
      const query = currentQuery();
      description.textContent = query.description;
      fields.innerHTML = "";

      if (!query.fields.length) {
        const empty = document.createElement("p");
        empty.className = "description";
        empty.textContent = "No fields required for this query.";
        fields.appendChild(empty);
        return;
      }

      query.fields.forEach((field) => {
        const label = document.createElement("label");
        label.textContent = field.label;
        const input = document.createElement("input");
        input.name = field.key;
        input.type = field.kind === "int" || field.kind === "number" ? "number" : field.kind === "date" ? "date" : "text";
        if (field.kind === "number") {
          input.step = "0.01";
        }
        label.appendChild(input);
        fields.appendChild(label);
      });
    }

    async function loadReference() {
      const referenceName = sections[currentSection].reference;
      if (referenceCache[currentSection]) {
        results.textContent = referenceCache[currentSection];
        setStatus("Done");
        return;
      }

      results.textContent = "Loading reference list...";
      setStatus("Loading reference list...");
      try {
        const output = await runQuery(referenceName);
        referenceCache[currentSection] = output;
        results.textContent = output;
        setStatus("Done");
      } catch (error) {
        results.textContent = error.message;
        setStatus("Query failed");
      }
    }

    function selectSection(sectionName) {
      currentSection = sectionName;
      renderModules();
      renderQueries();
      loadReference();
    }

    function collectArgs() {
      const query = currentQuery();
      const args = {};
      for (const field of query.fields) {
        const input = fields.querySelector(`[name="${field.key}"]`);
        const value = input.value.trim();
        if (!value && !field.optional) {
          throw new Error(`${field.label} is required.`);
        }
        args[field.key] = value;
      }
      return args;
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const username = document.querySelector("#username").value.trim();
      const password = document.querySelector("#password").value;

      if (username !== "admin" || password !== "admin") {
        loginError.textContent = "Invalid user or password.";
        document.querySelector("#password").value = "";
        return;
      }

      loginError.textContent = "";
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      selectSection(currentSection);
    });

    document.querySelector("#logoutButton").addEventListener("click", () => {
      appView.classList.add("hidden");
      loginView.classList.remove("hidden");
      document.querySelector("#username").focus();
    });

    querySelect.addEventListener("change", renderFields);

    document.querySelector("#runButton").addEventListener("click", async () => {
      try {
        const query = currentQuery();
        const args = collectArgs();
        results.textContent = "Loading...";
        setStatus(`Running ${query.title}...`);
        results.textContent = await runQuery(query.functionName, args);
        if (/^(Register|Update|Delete)/.test(query.functionName)) {
          referenceCache = {};
        }
        setStatus("Done");
      } catch (error) {
        results.textContent = error.message;
        setStatus("Query failed");
      }
    });

    document.querySelector("#clearFieldsButton").addEventListener("click", () => {
      fields.querySelectorAll("input").forEach((input) => {
        input.value = "";
      });
    });

    document.querySelector("#clearResultsButton").addEventListener("click", () => {
      results.textContent = "";
      setStatus("Ready");
    });

    document.querySelector("#copyButton").addEventListener("click", async () => {
      await navigator.clipboard.writeText(results.textContent);
      setStatus("Results copied");
    });

    renderModules();
    renderQueries();
  </script>
</body>
</html>
