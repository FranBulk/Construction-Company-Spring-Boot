<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Construction Company API</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d7dce2;
      --text: #20242b;
      --muted: #66717f;
      --accent: #166c7d;
      --accent-strong: #0f5362;
      --ok: #237a49;
      --shadow: 0 14px 36px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .topbar {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #fbfcfd;
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--muted);
    }

    .dot.ok {
      background: var(--ok);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      gap: 20px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.3;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      text-align: left;
      padding: 8px 10px;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      text-align: center;
    }

    button.primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    form {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    input {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      color: var(--text);
      font: inherit;
      background: #ffffff;
    }

    .viewer {
      min-height: 560px;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .viewer-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .endpoint {
      color: var(--muted);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    pre {
      margin: 0;
      padding: 16px;
      overflow: auto;
      background: #101820;
      color: #e8eef4;
      font: 13px/1.5 Consolas, "Courier New", monospace;
    }

    @media (max-width: 820px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>Construction Company API</h1>
      <div class="status" id="healthStatus"><span class="dot" id="healthDot"></span><span>Checking API</span></div>
    </div>
  </header>

  <main>
    <section class="controls">
      <h2>Quick Requests</h2>
      <div class="button-grid">
        <button data-method="GET" data-url="/api/health">GET /api/health</button>
        <button data-method="GET" data-url="/api/customers">GET /api/customers</button>
        <button data-method="GET" data-url="/api/construction-sites">GET /api/construction-sites</button>
        <button data-method="GET" data-url="/api/employees">GET /api/employees</button>
        <button data-method="GET" data-url="/api/machines">GET /api/machines</button>
        <button data-method="GET" data-url="/api/warehouses">GET /api/warehouses</button>
        <button data-method="GET" data-url="/api/materials">GET /api/materials</button>
      </div>

      <h2>Payment Test</h2>
      <form id="paymentForm">
        <label>
          Year
          <input name="year" type="number" min="2000" max="9999" value="2026">
        </label>
        <label>
          Week
          <input name="weekNumber" type="number" min="1" max="53" value="1">
        </label>
        <label>
          Employee ID
          <input name="employeeId" value="E001">
        </label>
        <button class="primary" type="submit">Queue Payment Through RabbitMQ</button>
      </form>
    </section>

    <section class="viewer">
      <div class="viewer-head">
        <h2>Response</h2>
        <div class="endpoint" id="endpoint">No request yet</div>
      </div>
      <pre id="output">Choose a request to test the Spring Boot API.</pre>
    </section>
  </main>

  <script>
    const output = document.querySelector("#output");
    const endpoint = document.querySelector("#endpoint");
    const healthStatus = document.querySelector("#healthStatus span:last-child");
    const healthDot = document.querySelector("#healthDot");

    async function sendRequest(method, url, body) {
      endpoint.textContent = `${method} ${url}`;
      output.textContent = "Loading...";

      const response = await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined
      });

      const text = await response.text();
      let content = text;

      try {
        content = JSON.stringify(JSON.parse(text), null, 2);
      } catch (error) {
        content = text || `${response.status} ${response.statusText}`;
      }

      output.textContent = content;
    }

    document.querySelectorAll("[data-url]").forEach((button) => {
      button.addEventListener("click", () => {
        sendRequest(button.dataset.method, button.dataset.url).catch((error) => {
          output.textContent = error.message;
        });
      });
    });

    document.querySelector("#paymentForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.currentTarget));
      sendRequest("POST", "/api/payments/pay", {
        year: Number(data.year),
        weekNumber: Number(data.weekNumber),
        employeeId: data.employeeId
      }).catch((error) => {
        output.textContent = error.message;
      });
    });

    sendRequest("GET", "/api/health")
      .then(() => {
        healthDot.classList.add("ok");
        healthStatus.textContent = "API and Oracle are UP";
      })
      .catch(() => {
        healthStatus.textContent = "API unavailable";
      });
  </script>
</body>
</html>
